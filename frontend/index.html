<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOAWS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="store.css?v=2" />
</head>

<body>

  <div id="toast"></div>

  <div id="cart-overlay" onclick="closeCart()"></div>
  <aside id="cart-drawer">
    <div class="drawer-header">
      <h2>Your bag <span id="cart-count">0</span></h2>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div id="cart-items"></div>
    <div id="cart-footer" class="cart-footer hidden">
      <div class="cart-totals">
        <div class="total-row"><span>Subtotal</span><span id="cart-subtotal">€0.00</span></div>
        <div class="total-row"><span>Shipping</span><span>€5.99</span></div>
        <div class="total-row grand"><span>Total</span><span id="cart-total">€0.00</span></div>
      </div>
      <button class="checkout-btn" onclick="openCheckout()">Checkout</button>
    </div>
  </aside>

  <div id="checkout-overlay" onclick="closeCheckout()"></div>
  <div id="checkout-modal">
    <button class="close-btn modal-close" onclick="closeCheckout()">✕</button>
    <h2>Complete your order</h2>
    <div class="checkout-form">
      <div class="form-group">
        <label>Full name</label>
        <input id="co-name" type="text" placeholder="Jane Doe" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input id="co-email" type="email" placeholder="jane@example.com" />
      </div>
      <div class="form-group">
        <label>Delivery address</label>
        <input id="co-address" type="text" placeholder="Enschede, NL" value="Enschede, NL" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Card number</label>
          <input id="co-card" type="text" placeholder="4242 4242 4242 4242" maxlength="19" />
        </div>
        <div class="form-group short">
          <label>Expiry</label>
          <input type="text" placeholder="MM/YY" maxlength="5" />
        </div>
        <div class="form-group short">
          <label>CVV</label>
          <input type="text" placeholder="123" maxlength="3" />
        </div>
      </div>
      <div id="order-summary-lines"></div>
      <button class="checkout-btn" id="pay-btn" onclick="placeOrder()">
        <span id="pay-label">Pay now</span>
      </button>
    </div>
  </div>

  <div id="success-overlay"></div>
  <div id="success-modal">
    <div class="success-icon">✓</div>
    <h2>Order placed!</h2>
    <p id="success-msg"></p>
    <button class="checkout-btn" onclick="closeSuccess()">Continue shopping</button>
  </div>

  <div id="auth-overlay" onclick="closeAuth()"></div>
  <div id="auth-modal">
    <button class="close-btn modal-close" onclick="closeAuth()">✕</button>
    <h2 id="auth-title">Welcome back</h2>
    <p class="subtitle" id="auth-subtitle">Sign in to your account</p>
    <div class="auth-form">
      <div class="form-group">
        <label>Username</label>
        <input id="auth-user" type="text" placeholder="jane.doe" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="auth-pass" type="password" placeholder="••••••••" />
      </div>
      <div class="form-group" id="auth-role-group" style="display: none;">
        <label>Role</label>
        <select id="auth-role"
          style="background:#252525; border:1px solid var(--border); border-radius:var(--radius); color:var(--dark); padding:10px 14px; font-family:var(--font-sans); font-size:14px; outline:none;">
          <option value="CUSTOMER">Customer</option>
          <option value="ADMINISTRATOR">Administrator</option>
          <option value="WAREHOUSE_STAFF">Warehouse Staff</option>
        </select>
      </div>
      <button class="checkout-btn" id="auth-submit-btn" onclick="submitAuth()">Sign In</button>
    </div>
    <div class="auth-switch" id="auth-switch">
      Don't have an account? <a onclick="toggleAuthMode()">Sign up</a>
    </div>
  </div>

  <header>
    <nav class="nav-left">
      <a href="#" onclick="filterCat('')">All</a>
      <a href="#" onclick="filterCat('tops')">Tops</a>
      <a href="#" onclick="filterCat('bottoms')">Bottoms</a>
      <a href="#" onclick="filterCat('footwear')">Footwear</a>
      <a href="#" onclick="filterCat('accessories')">Accessories</a>
    </nav>
    <div class="logo"></div>
    <div class="nav-right">
      <input id="search-input" type="text" placeholder="Search…" oninput="searchProducts(this.value)" />
      <button class="auth-btn" id="auth-btn" onclick="openAuth()">Sign in</button>
      <button class="bag-btn" onclick="openCart()">
        Bag <span id="bag-count" class="bag-count">0</span>
      </button>
    </div>
  </header>

  <section class="products-section">
    <div class="section-header">
      <h2 id="section-title">All products</h2>
      <p id="product-count" class="product-count"></p>
    </div>
    <div id="products-grid" class="products-grid"></div>
    <div id="empty-state" class="empty-state hidden">
      <p>No products found.</p>
    </div>
  </section>

  <script>
    const CATALOGUE = 'http://localhost:8082';
    const CART = 'http://localhost:8083';
    const AUTH = 'http://localhost:8087/api/auth';

    const SHIPPING_COST = 5.99;
    const SESSION = 'store-' + Math.random().toString(36).slice(2, 9);
    let cartItems = [];

    let isLoginMode = true;
    let currentUser = null;

    function checkAuth() {
      const token = localStorage.getItem('auth_token');
      if (token) {
        document.getElementById('auth-btn').onclick = logout;
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          currentUser = payload;
          document.getElementById('auth-btn').textContent = payload.sub || 'Sign out';
        } catch (e) {
          document.getElementById('auth-btn').textContent = 'Sign out';
        }
      } else {
        document.getElementById('auth-btn').textContent = 'Sign in';
        document.getElementById('auth-btn').onclick = openAuth;
        currentUser = null;
      }
    }

    function logout() {
      localStorage.removeItem('auth_token');
      toast('Logged out');
      checkAuth();
    }

    function openAuth() {
      document.getElementById('auth-user').value = '';
      document.getElementById('auth-pass').value = '';
      document.getElementById('auth-overlay').classList.add('show');
      document.getElementById('auth-modal').classList.add('open');
    }

    function closeAuth() {
      document.getElementById('auth-overlay').classList.remove('show');
      document.getElementById('auth-modal').classList.remove('open');
    }

    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('auth-title').textContent = isLoginMode ? 'Welcome back' : 'Create account';
      document.getElementById('auth-subtitle').textContent = isLoginMode ? 'Sign in to your account' : 'Join us to checkout quickly';
      document.getElementById('auth-submit-btn').textContent = isLoginMode ? 'Sign In' : 'Sign Up';
      document.getElementById('auth-switch').innerHTML = isLoginMode
        ? `Don't have an account? <a onclick="toggleAuthMode()">Sign up</a>`
        : `Already have an account? <a onclick="toggleAuthMode()">Sign in</a>`;
      document.getElementById('auth-role-group').style.display = isLoginMode ? 'none' : 'flex';
    }

    async function submitAuth() {
      const user = document.getElementById('auth-user').value.trim();
      const pass = document.getElementById('auth-pass').value;
      const role = document.getElementById('auth-role').value;

      if (!user || !pass) {
        toast('Please fill all fields', 'err');
        return;
      }

      document.getElementById('auth-submit-btn').disabled = true;

      const url = isLoginMode ? `${AUTH}/login` : `${AUTH}/register`;
      const payload = isLoginMode ? { username: user, password: pass } : { username: user, password: pass, role: role };

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok) {
          toast(data.message || 'Authentication failed', 'err');
        } else {
          localStorage.setItem('auth_token', data.token);
          toast(`Welcome, ${data.username}!`);
          closeAuth();
          checkAuth();
        }
      } catch (e) {
        toast('Could not reach auth service', 'err');
      } finally {
        document.getElementById('auth-submit-btn').disabled = false;
      }
    }

    function toast(msg, type = 'ok') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'show ' + type;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.className = '', 2800);
    }

    async function loadProducts(category = '', search = '') {
      let url = `${CATALOGUE}/products`;
      const params = [];
      if (category) params.push(`category=${encodeURIComponent(category)}`);
      if (search) params.push(`search=${encodeURIComponent(search)}`);
      if (params.length) url += '?' + params.join('&');
      try {
        const res = await fetch(url);
        const data = await res.json();
        renderProducts(data, category, search);
      } catch (e) {
        toast('Could not reach catalogue service', 'err');
      }
    }

    function renderProducts(products, category, search) {
      const grid = document.getElementById('products-grid');
      const empty = document.getElementById('empty-state');
      document.getElementById('section-title').textContent = category
        ? category.charAt(0).toUpperCase() + category.slice(1)
        : search ? `Results for "${search}"` : 'All products';
      document.getElementById('product-count').textContent =
        `${products.length} item${products.length !== 1 ? 's' : ''}`;

      if (products.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      const colors = ['#3d5a4a', '#3d4a5a', '#4a5a3d', '#5a3d4a', '#4a3d5a', '#5a5a3d'];
      grid.innerHTML = products.map(p => {
        const inStock = p.stockQuantity > 0;
        const bg = colors[p.id % colors.length];
        return `
          <div class="product-card ${!inStock ? 'out-of-stock' : ''}"
               onclick="${inStock ? `quickAdd(${p.id})` : ''}">
            <div class="product-img" style="background:${bg}">
              <div class="product-initial">${p.name.charAt(0)}</div>
              ${!inStock ? '<div class="sold-out-badge">Sold out</div>' : ''}
              ${inStock ? '<div class="add-overlay">Add to bag</div>' : ''}
            </div>
            <div class="product-info">
              <p class="product-name">${p.name}</p>
              <p class="product-cat">${p.category}</p>
              <p class="product-price">€${p.price.toFixed(2)}</p>
              ${inStock ? `<p class="product-stock">${p.stockQuantity} left</p>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    function filterCat(cat) {
      document.getElementById('search-input').value = '';
      loadProducts(cat);
      window.scrollTo({ top: document.querySelector('.products-section').offsetTop - 80, behavior: 'smooth' });
    }

    let searchTimer;
    function searchProducts(val) {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadProducts('', val), 350);
    }

    async function quickAdd(productId) {
      try {
        const res = await fetch(`${CART}/cart/${SESSION}/items`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId, quantity: 1 })
        });
        if (!res.ok) {
          const err = await res.json();
          toast(err.error || 'Could not add item', 'err');
          return;
        }
        toast('Added to bag ✓');
        await refreshCart();
      } catch (e) {
        toast('Cart service unavailable', 'err');
      }
    }

    async function refreshCart() {
      try {
        const res = await fetch(`${CART}/cart/${SESSION}`);
        const data = await res.json();
        cartItems = data.items || [];
        renderCart(data);
      } catch (e) { }
    }

    function renderCart(data) {
      const items = data.items || [];
      const subtotal = data.subtotal || 0;
      const total = subtotal + SHIPPING_COST;
      const count = items.reduce((s, i) => s + i.quantity, 0);

      document.getElementById('cart-count').textContent = count;
      document.getElementById('bag-count').textContent = count;

      const container = document.getElementById('cart-items');
      if (items.length === 0) {
        container.innerHTML = '<p class="empty-cart">Your bag is empty.</p>';
        document.getElementById('cart-footer').classList.add('hidden');
        return;
      }

      const colors = ['#3d5a4a', '#3d4a5a', '#4a5a3d', '#5a3d4a', '#4a3d5a', '#5a5a3d'];
      container.innerHTML = items.map(item => `
        <div class="cart-item">
          <div class="cart-item-color" style="background:${colors[item.productId % 6]}">
            ${item.productName.charAt(0)}
          </div>
          <div class="cart-item-details">
            <p class="cart-item-name">${item.productName}</p>
            <p class="cart-item-qty">Qty: ${item.quantity}</p>
          </div>
          <div class="cart-item-right">
            <p class="cart-item-price">€${(item.productPrice * item.quantity).toFixed(2)}</p>
            <button class="remove-btn" onclick="removeItem(${item.productId})">Remove</button>
          </div>
        </div>`).join('');

      document.getElementById('cart-footer').classList.remove('hidden');
      document.getElementById('cart-subtotal').textContent = `€${subtotal.toFixed(2)}`;
      document.getElementById('cart-total').textContent = `€${total.toFixed(2)}`;
    }

    async function removeItem(productId) {
      try {
        await fetch(`${CART}/cart/${SESSION}/items/${productId}`, { method: 'DELETE' });
        await refreshCart();
        toast('Item removed');
      } catch (e) {
        toast('Could not remove item', 'err');
      }
    }

    function openCart() {
      refreshCart();
      document.getElementById('cart-drawer').classList.add('open');
      document.getElementById('cart-overlay').classList.add('show');
    }
    function closeCart() {
      document.getElementById('cart-drawer').classList.remove('open');
      document.getElementById('cart-overlay').classList.remove('show');
    }
    function openCheckout() {
      if (cartItems.length === 0) return;
      closeCart();
      renderOrderSummary();
      document.getElementById('checkout-modal').classList.add('open');
      document.getElementById('checkout-overlay').classList.add('show');
    }
    function closeCheckout() {
      document.getElementById('checkout-modal').classList.remove('open');
      document.getElementById('checkout-overlay').classList.remove('show');
    }

    function renderOrderSummary() {
      const subtotal = cartItems.reduce((s, i) => s + i.productPrice * i.quantity, 0);
      const total = subtotal + SHIPPING_COST;
      document.getElementById('order-summary-lines').innerHTML = `
        <div class="order-summary">
          ${cartItems.map(i => `
            <div class="summary-line">
              <span>${i.productName} × ${i.quantity}</span>
              <span>€${(i.productPrice * i.quantity).toFixed(2)}</span>
            </div>`).join('')}
          <div class="summary-line muted"><span>Shipping</span><span>€${SHIPPING_COST.toFixed(2)}</span></div>
          <div class="summary-line bold"><span>Total</span><span>€${total.toFixed(2)}</span></div>
        </div>`;
      document.getElementById('pay-label').textContent = `Pay €${total.toFixed(2)}`;
    }

    async function placeOrder() {
      const address = document.getElementById('co-address').value.trim();
      if (!address) { toast('Please enter a delivery address', 'err'); return; }

      const btn = document.getElementById('pay-btn');
      btn.disabled = true;
      document.getElementById('pay-label').textContent = 'Processing…';

      try {
        const res = await fetch(`${CART}/cart/${SESSION}/checkout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address, paymentMethod: 'card' })
        });
        const data = await res.json();

        if (!res.ok) {
          toast(data.error || 'Checkout failed', 'err');
          btn.disabled = false;
          document.getElementById('pay-label').textContent = 'Pay now';
          return;
        }

        closeCheckout();
        document.getElementById('success-msg').textContent =
          `Transaction ${data.transactionId}. Total paid: €${data.total?.toFixed(2)}.`;
        document.getElementById('success-overlay').classList.add('show');
        document.getElementById('success-modal').classList.add('open');
        await refreshCart();

      } catch (e) {
        toast('Could not reach checkout service', 'err');
        btn.disabled = false;
        document.getElementById('pay-label').textContent = 'Pay now';
      }
    }

    async function closeSuccess() {
      document.getElementById('success-overlay').classList.remove('show');
      document.getElementById('success-modal').classList.remove('open');
      await loadProducts();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    loadProducts();
    refreshCart();
    checkAuth();
  </script>
</body>

</html>
