---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-config
  namespace: ecommerce
data:
  SPRING_DATASOURCE_URL: "jdbc:h2:mem:cartdb"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "create-drop"
  SPRING_APPLICATION_NAME: "cart-service"
  CATALOGUE_SERVICE_URL: "http://catalogue-service:8082"
  PAYMENT_SERVICE_URL: "http://payment-service:8084"
  WAREHOUSE_SERVICE_URL: "http://warehouse-service:8086"

---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: ecommerce
  labels:
    app: cart-service
spec:
  type: ClusterIP
  ports:
    - port: 8083
      targetPort: 8083
      protocol: TCP
      name: http
  selector:
    app: cart-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: ecommerce
  labels:
    app: cart-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.28
          command: ['sh', '-c', "until nc -z catalogue-service 8082 && nc -z payment-service 8084 && nc -z warehouse-service 8086; do echo waiting for dependencies; sleep 2; done"]
      containers:
        - name: cart-service
          image: ecommerce/cart-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: cart-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
