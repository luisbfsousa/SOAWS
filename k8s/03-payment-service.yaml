---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: ecommerce
data:
  SPRING_DATASOURCE_URL: "jdbc:h2:mem:paymentdb"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "create-drop"
  SPRING_APPLICATION_NAME: "payment-service"
  SPRING_ACTIVEMQ_BROKER_URL: "tcp://activemq-service:61616"

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ecommerce
  labels:
    app: payment-service
spec:
  type: ClusterIP
  ports:
    - port: 8084
      targetPort: 8084
      protocol: TCP
      name: http
  selector:
    app: payment-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ecommerce
  labels:
    app: payment-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: ecommerce/payment-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: payment-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
