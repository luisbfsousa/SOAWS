---
apiVersion: v1
kind: ConfigMap
metadata:
  name: warehouse-config
  namespace: ecommerce
data:
  SPRING_DATASOURCE_URL: "jdbc:h2:mem:warehousedb"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "create-drop"
  SPRING_APPLICATION_NAME: "warehouse-service"
  SPRING_ACTIVEMQ_BROKER_URL: "tcp://activemq-service:61616"
  WAREHOUSE_SYNC_ON_STARTUP: "false"

---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-service
  namespace: ecommerce
  labels:
    app: warehouse-service
spec:
  type: ClusterIP
  ports:
    - port: 8086
      targetPort: 8086
      protocol: TCP
      name: http
  selector:
    app: warehouse-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-service
  namespace: ecommerce
  labels:
    app: warehouse-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: warehouse-service
  template:
    metadata:
      labels:
        app: warehouse-service
    spec:
      containers:
        - name: warehouse-service
          image: ecommerce/warehouse-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: warehouse-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
