---
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  labels:
    name: ecommerce

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue-config
  namespace: ecommerce
data:
  SPRING_DATASOURCE_URL: "jdbc:h2:mem:cataloguedb"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "create-drop"
  SPRING_APPLICATION_NAME: "catalogue-service"

---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-service
  namespace: ecommerce
  labels:
    app: catalogue-service
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: http
  selector:
    app: catalogue-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-service
  namespace: ecommerce
  labels:
    app: catalogue-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: catalogue-service
  template:
    metadata:
      labels:
        app: catalogue-service
    spec:
      containers:
        - name: catalogue-service
          image: ecommerce/catalogue-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: catalogue-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
