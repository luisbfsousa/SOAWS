services:
  catalogue-service:
    build:
      context: .
      dockerfile: catalogue-service/Dockerfile
    container_name: catalogue-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:cataloguedb
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
    networks:
      - ecommerce-network

  authentication-service:
    build:
      context: .
      dockerfile: authentication-service/Dockerfile
    container_name: authentication-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:authdb
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - ecommerce-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:paymentdb
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - SPRING_ACTIVEMQ_BROKER_URL=tcp://activemq:61616
    depends_on:
      - activemq
    networks:
      - ecommerce-network

  warehouse-service:
    build:
      context: .
      dockerfile: warehouse-service/Dockerfile
    container_name: warehouse-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:warehousedb
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - SPRING_ACTIVEMQ_BROKER_URL=tcp://activemq:61616
    depends_on:
      - activemq
    networks:
      - ecommerce-network

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: cart-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:cartdb
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - CATALOGUE_SERVICE_URL=http://catalogue-service:8082
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - WAREHOUSE_SERVICE_URL=http://warehouse-service:8086
    depends_on:
      - catalogue-service
      - payment-service
      - warehouse-service
    networks:
      - ecommerce-network

  activemq:
    image: apache/activemq:latest
    container_name: activemq
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ACTIVEMQ_ADMIN_LOGIN: admin
      ACTIVEMQ_ADMIN_PASSWORD: admin
    networks:
      - ecommerce-network

  frontend:
    image: nginx:alpine
    container_name: frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cart-service
      - authentication-service
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
