<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Console</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1></h1>
    <div>
      <label></label>
      <input id="session-id" type="text" value="session-001" />
    </div>
  </header>

  <main>
      <nav class="sidebar">
        <h3>Services</h3>
        <button onclick="switchService('catalogue')" class="active">Catalogue (8082)</button>
        <button onclick="switchService('cart')">Cart (8083)</button>
        <button onclick="switchService('payment')">Payment (8084)</button>
        <button onclick="switchService('warehouse')">Warehouse (8086)</button>
      </nav>

      <section class="content">
        <div id="catalogue" class="panel active">
          <h2>Catalogue Service</h2>
          <div class="form-group">
            <input id="cat-category" type="text" placeholder="category (optional)" />
            <input id="cat-search" type="text" placeholder="search (optional)" />
            <button onclick="getProducts()">GET /products</button>
          </div>
          <div class="form-group">
            <input id="cat-id" type="number" placeholder="product id" value="1" />
            <button onclick="getProduct()">GET /products/{id}</button>
          </div>
          <div class="form-group">
            <input id="new-name" type="text" placeholder="name" />
            <input id="new-cat" type="text" placeholder="category" />
            <input id="new-price" type="number" placeholder="price" />
            <input id="new-stock" type="number" placeholder="stock" />
            <button onclick="createProduct()">POST /products</button>
          </div>
        </div>

        <div id="cart" class="panel">
          <h2>Cart Service</h2>
          <div class="form-group">
            <button onclick="getCart()">GET /cart</button>
          </div>
          <div class="form-group">
            <input id="cart-product-id" type="number" placeholder="productId" value="1" />
            <input id="cart-qty" type="number" placeholder="quantity" value="1" />
            <button onclick="addToCart()">POST /cart/items</button>
          </div>
          <div class="form-group">
            <input id="remove-product-id" type="number" placeholder="productId" value="1" />
            <button onclick="removeFromCart()">DELETE /cart/items</button>
          </div>
          <div class="form-group">
            <input id="checkout-address" type="text" placeholder="address" />
            <select id="checkout-payment">
              <option value="card">card</option>
              <option value="paypal">paypal</option>
            </select>
            <button onclick="checkout()">POST /checkout</button>
          </div>
        </div>

        <div id="payment" class="panel">
          <h2>Payment Service</h2>
          <div class="form-group">
            <input id="txn-id" type="text" placeholder="transactionId" />
            <button onclick="getPayment()">GET /payments/{id}</button>
          </div>
        </div>

        <div id="warehouse" class="panel">
          <h2>Warehouse Service</h2>
          <div class="form-group">
            <button onclick="getInventory()">GET /inventory</button>
          </div>
          <div class="form-group">
            <input id="restock-id" type="number" placeholder="productId" value="1" />
            <input id="restock-qty" type="number" placeholder="quantity to add" value="50" />
            <button onclick="restock()">PATCH /inventory</button>
          </div>
        </div>
      </section>

    <aside class="log-panel">
      <div class="log-header">
        <span>Responses</span>
        <button onclick="clearLog()">Clear</button>
      </div>
      <div id="log"></div>
    </aside>
  </main>

  <script>
    const SERVICES = {
      catalogue: 'http://localhost:8082',
      cart: 'http://localhost:8083',
      payment: 'http://localhost:8084',
      warehouse: 'http://localhost:8086',
    };

    function sessionId() {
      return document.getElementById('session-id').value.trim() || 'session-001';
    }

    function switchService(name) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      event.target.classList.add('active');
    }

    function log(method, url, status, body) {
      const el = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${status >= 200 && status < 300 ? 'ok' : 'err'}`;
      entry.innerHTML = `<strong>${method} ${url}</strong> [${status}]<pre>${JSON.stringify(body, null, 2)}</pre>`;
      el.prepend(entry);
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    async function req(method, url, body) {
      try {
        const opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(url, opts);
        const data = await res.json().catch(() => ({}));
        log(method, url, res.status, data);
      } catch (e) {
        log(method, url, 0, { error: e.message });
      }
    }

    function getProducts() {
      const cat = document.getElementById('cat-category').value;
      const search = document.getElementById('cat-search').value;
      let url = `${SERVICES.catalogue}/products`;
      const params = [];
      if (cat) params.push(`category=${encodeURIComponent(cat)}`);
      if (search) params.push(`search=${encodeURIComponent(search)}`);
      if (params.length) url += '?' + params.join('&');
      req('GET', url);
    }

    function getProduct() {
      req('GET', `${SERVICES.catalogue}/products/${document.getElementById('cat-id').value}`);
    }

    function createProduct() {
      req('POST', `${SERVICES.catalogue}/products`, {
        name: document.getElementById('new-name').value,
        category: document.getElementById('new-cat').value,
        price: parseFloat(document.getElementById('new-price').value),
        stockQuantity: parseInt(document.getElementById('new-stock').value),
      });
    }

    function getCart() { req('GET', `${SERVICES.cart}/cart/${sessionId()}`); }

    function addToCart() {
      req('POST', `${SERVICES.cart}/cart/${sessionId()}/items`, {
        productId: parseInt(document.getElementById('cart-product-id').value),
        quantity: parseInt(document.getElementById('cart-qty').value),
      });
    }

    function removeFromCart() {
      req('DELETE', `${SERVICES.cart}/cart/${sessionId()}/items/${document.getElementById('remove-product-id').value}`);
    }

    function checkout() {
      req('POST', `${SERVICES.cart}/cart/${sessionId()}/checkout`, {
        address: document.getElementById('checkout-address').value,
        paymentMethod: document.getElementById('checkout-payment').value,
      });
    }

    function getPayment() {
      req('GET', `${SERVICES.payment}/payments/${document.getElementById('txn-id').value}`);
    }

    function getInventory() { req('GET', `${SERVICES.warehouse}/warehouse/inventory`); }

    function restock() {
      req('PATCH', `${SERVICES.warehouse}/warehouse/inventory/${document.getElementById('restock-id').value}`, {
        quantity: parseInt(document.getElementById('restock-qty').value),
      });
    }
  </script>
</body>
</html>
